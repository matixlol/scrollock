<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Feed controls</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <section class="connection" aria-label="Telegram connection">
        <div>
          <strong id="identity">Telegram not connected</strong>
          <p id="connection-copy">Connect to unblock feeds.</p>
        </div>
        <button id="connect">Connect</button>
      </section>
      <section id="sites" aria-label="Feed controls"></section>
      <p class="disclosure">
        Unblock for 5 minutes. Your Telegram group receives your name, site and
        route categories. No messages, searches or page contents.
      </p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
